<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a12">
  <title>Neon Arcade</title>
  <style>
    :root {
      --ink: #f7fbff;
      --muted: #91a0b8;
      --panel: rgba(14, 20, 34, 0.78);
      --line: rgba(255, 255, 255, 0.12);
      --cyan: #42e8e0;
      --violet: #9c6bff;
      --danger: #ff557a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(66, 232, 224, 0.12), transparent 26%),
        radial-gradient(circle at 85% 80%, rgba(156, 107, 255, 0.14), transparent 30%),
        #070a12;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .arcade-app { width: min(100%, 1040px); }

    .arcade-nav {
      margin-bottom: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(14, 20, 34, 0.82);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(18px);
    }

    .arcade-title {
      margin: 0;
      font-size: 0.88rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .arcade-title span { color: var(--cyan); }
    .game-nav { display: flex; gap: 6px; }
    .game-nav button { color: var(--muted); background: transparent; }
    .game-nav button.active { color: #04100f; background: var(--cyan); border-color: var(--cyan); }
    [data-game-panel][hidden] { display: none; }

    .game-shell {
      width: 100%;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .topbar,
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      margin: 0;
      font-size: clamp(1.15rem, 3vw, 1.65rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand span { color: var(--cyan); }
    .brand .violet { color: var(--violet); }

    .scoreboard {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .score {
      color: var(--ink);
      font-size: 1.55rem;
      font-variant-numeric: tabular-nums;
    }

    .canvas-wrap {
      position: relative;
      margin: 16px 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: #080c16;
      box-shadow: inset 0 0 60px rgba(66, 232, 224, 0.04);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: rgba(5, 8, 15, 0.55);
      backdrop-filter: blur(4px);
      transition: opacity 180ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card h2 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 5vw, 3.5rem);
    }

    .overlay-card p {
      margin: 0;
      color: var(--muted);
    }

    .controls { color: var(--muted); }

    .settings {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .setting-label {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .segmented { display: flex; gap: 4px; }

    .segmented button {
      padding: 8px 12px;
      color: var(--muted);
      background: transparent;
    }

    .segmented button.active {
      color: #04100f;
      background: var(--cyan);
      border-color: var(--cyan);
    }

    .setting-group.disabled {
      opacity: 0.38;
      pointer-events: none;
    }

    .hint {
      margin: 0;
      font-size: 0.82rem;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 10px 16px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(66, 232, 224, 0.55);
      background: rgba(66, 232, 224, 0.1);
    }

    button:focus-visible {
      outline: 3px solid rgba(66, 232, 224, 0.35);
      outline-offset: 2px;
    }

    .primary {
      color: #04100f;
      background: var(--cyan);
      border-color: var(--cyan);
    }

    .primary:hover { background: #79fff6; }

    @media (max-width: 640px) {
      body { padding: 10px; }
      .arcade-nav { align-items: stretch; flex-direction: column; }
      .game-nav { width: 100%; }
      .game-nav button { flex: 1; }
      .game-shell { padding: 12px; border-radius: 18px; }
      .topbar, .controls { align-items: flex-start; flex-direction: column; }
      .settings { align-items: stretch; flex-direction: column; }
      .setting-group { justify-content: space-between; }
      .scoreboard { width: 100%; justify-content: space-between; }
      .button-row { width: 100%; }
      button { flex: 1; }
      .hint { line-height: 1.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body data-active-game="pong">
  <div class="arcade-app">
    <nav class="arcade-nav" aria-label="Game navigation">
      <p class="arcade-title">Neon <span>Arcade</span></p>
      <div class="game-nav">
        <button class="active" type="button" data-game-link="pong" aria-current="page">Pong</button>
        <button type="button" data-game-link="breaker">Brick Breaker</button>
      </div>
    </nav>

  <main class="game-shell" data-game-panel="pong">
    <header class="topbar">
      <h1 class="brand">Neon <span>Pong</span></h1>
      <div class="scoreboard" aria-live="polite">
        <span id="leftPlayerLabel">You</span><strong class="score" id="playerScore">0</strong>
        <span id="matchLabel">First to 7</span>
        <strong class="score" id="computerScore">0</strong><span id="rightPlayerLabel">CPU</span>
      </div>
    </header>

    <div class="canvas-wrap">
      <canvas id="game" width="1000" height="600" aria-label="Pong game area"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">Ready?</h2>
          <p id="overlayText">Press Space or Start to serve.</p>
        </div>
      </div>
    </div>

    <section class="settings" aria-label="Game settings">
      <div class="setting-group">
        <span class="setting-label">Mode</span>
        <div class="segmented" id="modeButtons">
          <button class="active" type="button" data-mode="cpu">1 Player</button>
          <button type="button" data-mode="pvp">2 Players</button>
        </div>
      </div>
      <div class="setting-group" id="difficultyGroup">
        <span class="setting-label">CPU Level</span>
        <div class="segmented" id="difficultyButtons">
          <button type="button" data-difficulty="easy">Easy</button>
          <button class="active" type="button" data-difficulty="medium">Medium</button>
          <button type="button" data-difficulty="hard">Hard</button>
        </div>
      </div>
    </section>

    <footer class="controls">
      <p class="hint" id="controlsHint"><strong>Move:</strong> W / S, arrow keys, mouse, or touch</p>
      <div class="button-row">
        <button class="primary" id="startButton" type="button">Start</button>
        <button id="restartButton" type="button">Restart</button>
      </div>
    </footer>
  </main>

  <main class="game-shell" data-game-panel="breaker" hidden>
    <header class="topbar">
      <h1 class="brand">Brick <span class="violet">Breaker</span></h1>
      <div class="scoreboard" aria-live="polite">
        <span>Score</span><strong class="score" id="brickScore">0</strong>
        <span>Lives</span><strong class="score" id="brickLives">3</strong>
      </div>
    </header>

    <div class="canvas-wrap">
      <canvas id="brickGame" width="1000" height="600" aria-label="Brick Breaker game area"></canvas>
      <div class="overlay" id="brickOverlay">
        <div class="overlay-card">
          <h2 id="brickOverlayTitle">Break the wall</h2>
          <p id="brickOverlayText">Press Space or Start to launch.</p>
        </div>
      </div>
    </div>

    <footer class="controls">
      <p class="hint"><strong>Move:</strong> A / D, ← / →, mouse, or touch</p>
      <div class="button-row">
        <button class="primary" id="brickStartButton" type="button">Start</button>
        <button id="brickRestartButton" type="button">Restart</button>
      </div>
    </footer>
  </main>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const startButton = document.getElementById('startButton');
      const restartButton = document.getElementById('restartButton');
      const playerScoreElement = document.getElementById('playerScore');
      const computerScoreElement = document.getElementById('computerScore');
      const leftPlayerLabel = document.getElementById('leftPlayerLabel');
      const rightPlayerLabel = document.getElementById('rightPlayerLabel');
      const controlsHint = document.getElementById('controlsHint');
      const modeButtons = [...document.querySelectorAll('[data-mode]')];
      const difficultyButtons = [...document.querySelectorAll('[data-difficulty]')];
      const difficultyGroup = document.getElementById('difficultyGroup');

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const WINNING_SCORE = 7;
      const PADDLE_WIDTH = 16;
      const PADDLE_HEIGHT = 112;
      const BALL_RADIUS = 11;

      const player = { x: 34, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, score: 0 };
      const computer = { x: WIDTH - 34 - PADDLE_WIDTH, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, score: 0 };
      const ball = { x: WIDTH / 2, y: HEIGHT / 2, vx: 0, vy: 0, speed: 560 };
      const keys = new Set();
      const difficultySettings = {
        easy: { speed: 300, error: 82, prediction: 0.00 },
        medium: { speed: 470, error: 30, prediction: 0.08 },
        hard: { speed: 720, error: 7, prediction: 0.20 }
      };

      let running = false;
      let gameOver = false;
      let gameMode = 'cpu';
      let difficulty = 'medium';
      let lastTime = performance.now();
      let animationId = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function resetPositions(direction = Math.random() < 0.5 ? -1 : 1) {
        player.y = HEIGHT / 2 - PADDLE_HEIGHT / 2;
        computer.y = HEIGHT / 2 - PADDLE_HEIGHT / 2;
        ball.x = WIDTH / 2;
        ball.y = HEIGHT / 2;
        ball.speed = 560;
        const angle = (Math.random() * 0.7 - 0.35);
        ball.vx = Math.cos(angle) * ball.speed * direction;
        ball.vy = Math.sin(angle) * ball.speed;
      }

      function setOverlay(title, text, visible = true) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlay.classList.toggle('hidden', !visible);
      }

      function updateScoreboard() {
        playerScoreElement.textContent = player.score;
        computerScoreElement.textContent = computer.score;
      }

      function updateSettingsUI() {
        modeButtons.forEach((button) => {
          const active = button.dataset.mode === gameMode;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });

        difficultyButtons.forEach((button) => {
          const active = button.dataset.difficulty === difficulty;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });

        const twoPlayer = gameMode === 'pvp';
        difficultyGroup.classList.toggle('disabled', twoPlayer);
        difficultyGroup.setAttribute('aria-disabled', String(twoPlayer));
        leftPlayerLabel.textContent = twoPlayer ? 'P1' : 'You';
        rightPlayerLabel.textContent = twoPlayer ? 'P2' : `CPU ${difficulty}`;
        controlsHint.innerHTML = twoPlayer
          ? '<strong>P1:</strong> W / A up, S / D down &nbsp; <strong>P2:</strong> ↑ / ↓'
          : '<strong>Move:</strong> W / S, arrow keys, mouse, or touch';
      }

      function changeMode(nextMode) {
        if (gameMode === nextMode) return;
        gameMode = nextMode;
        updateSettingsUI();
        restartGame();
      }

      function changeDifficulty(nextDifficulty) {
        if (difficulty === nextDifficulty || gameMode === 'pvp') return;
        difficulty = nextDifficulty;
        updateSettingsUI();
        restartGame();
      }

      function startGame() {
        if (gameOver) restartGame();
        if (ball.vx === 0) resetPositions(1);
        running = true;
        startButton.textContent = 'Pause';
        setOverlay('', '', false);
        lastTime = performance.now();
      }

      function togglePause() {
        if (gameOver) {
          restartGame();
          startGame();
          return;
        }

        running = !running;
        startButton.textContent = running ? 'Pause' : 'Resume';
        setOverlay('Paused', 'Press Space or Resume to continue.', !running);
        lastTime = performance.now();
      }

      function restartGame() {
        player.score = 0;
        computer.score = 0;
        gameOver = false;
        running = false;
        ball.vx = 0;
        ball.vy = 0;
        resetPositions(1);
        ball.vx = 0;
        ball.vy = 0;
        updateScoreboard();
        startButton.textContent = 'Start';
        setOverlay('Ready?', 'Press Space or Start to serve.');
        draw();
      }

      function scorePoint(scoringPlayer) {
        scoringPlayer.score += 1;
        updateScoreboard();

        if (scoringPlayer.score >= WINNING_SCORE) {
          running = false;
          gameOver = true;
          ball.vx = 0;
          ball.vy = 0;
          startButton.textContent = 'Play Again';
          const winner = scoringPlayer === player
            ? (gameMode === 'pvp' ? 'Player 1 wins!' : 'You win!')
            : (gameMode === 'pvp' ? 'Player 2 wins!' : 'CPU wins');
          setOverlay(winner, 'Press Play Again or Space for another match.');
          return;
        }

        running = false;
        ball.vx = 0;
        ball.vy = 0;
        startButton.textContent = 'Serve';
        const scorer = scoringPlayer === player
          ? (gameMode === 'pvp' ? 'Point to Player 1' : 'Point to you')
          : (gameMode === 'pvp' ? 'Point to Player 2' : 'Point to CPU');
        setOverlay(scorer, 'Press Space or Serve for the next point.');
      }

      function paddleCollision(paddle, isPlayer) {
        const movingTowardPaddle = isPlayer ? ball.vx < 0 : ball.vx > 0;
        const intersectsX = isPlayer
          ? ball.x - BALL_RADIUS <= paddle.x + PADDLE_WIDTH && ball.x > paddle.x
          : ball.x + BALL_RADIUS >= paddle.x && ball.x < paddle.x + PADDLE_WIDTH;
        const intersectsY = ball.y + BALL_RADIUS >= paddle.y && ball.y - BALL_RADIUS <= paddle.y + PADDLE_HEIGHT;

        if (!movingTowardPaddle || !intersectsX || !intersectsY) return;

        const relativeHit = (ball.y - (paddle.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        const bounceAngle = relativeHit * 0.95;
        ball.speed = Math.min(ball.speed + 32, 980);
        ball.vx = Math.cos(bounceAngle) * ball.speed * (isPlayer ? 1 : -1);
        ball.vy = Math.sin(bounceAngle) * ball.speed;
        ball.x = isPlayer
          ? paddle.x + PADDLE_WIDTH + BALL_RADIUS
          : paddle.x - BALL_RADIUS;
      }

      function update(delta) {
        const playerSpeed = 680;
        const leftUp = keys.has('w') || keys.has('a') || (gameMode === 'cpu' && keys.has('arrowup'));
        const leftDown = keys.has('s') || keys.has('d') || (gameMode === 'cpu' && keys.has('arrowdown'));
        if (leftUp) player.y -= playerSpeed * delta;
        if (leftDown) player.y += playerSpeed * delta;
        player.y = clamp(player.y, 0, HEIGHT - PADDLE_HEIGHT);

        if (gameMode === 'pvp') {
          if (keys.has('arrowup')) computer.y -= playerSpeed * delta;
          if (keys.has('arrowdown')) computer.y += playerSpeed * delta;
        } else {
          const level = difficultySettings[difficulty];
          const predictedY = ball.y + ball.vy * level.prediction;
          const target = predictedY - PADDLE_HEIGHT / 2;
          const aiError = Math.sin(performance.now() / 540) * level.error;
          const movement = clamp(target + aiError - computer.y, -level.speed * delta, level.speed * delta);
          computer.y += movement;
        }
        computer.y = clamp(computer.y, 0, HEIGHT - PADDLE_HEIGHT);

        ball.x += ball.vx * delta;
        ball.y += ball.vy * delta;

        if (ball.y - BALL_RADIUS <= 0) {
          ball.y = BALL_RADIUS;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + BALL_RADIUS >= HEIGHT) {
          ball.y = HEIGHT - BALL_RADIUS;
          ball.vy = -Math.abs(ball.vy);
        }

        paddleCollision(player, true);
        paddleCollision(computer, false);

        if (ball.x + BALL_RADIUS < 0) scorePoint(computer);
        if (ball.x - BALL_RADIUS > WIDTH) scorePoint(player);
      }

      function drawCourt() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        const background = ctx.createLinearGradient(0, 0, WIDTH, HEIGHT);
        background.addColorStop(0, '#080d18');
        background.addColorStop(1, '#0c1120');
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.strokeStyle = 'rgba(255,255,255,0.13)';
        ctx.lineWidth = 4;
        ctx.setLineDash([16, 18]);
        ctx.beginPath();
        ctx.moveTo(WIDTH / 2, 0);
        ctx.lineTo(WIDTH / 2, HEIGHT);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.strokeStyle = 'rgba(66,232,224,0.1)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(WIDTH / 2, HEIGHT / 2, 86, 0, Math.PI * 2);
        ctx.stroke();
      }

      function drawPaddle(paddle, color) {
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 22;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(paddle.x, paddle.y, PADDLE_WIDTH, PADDLE_HEIGHT, 8);
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        drawCourt();
        drawPaddle(player, '#42e8e0');
        drawPaddle(computer, '#9c6bff');

        ctx.save();
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 22;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function gameLoop(now) {
        const delta = Math.min((now - lastTime) / 1000, 0.025);
        lastTime = now;
        if (running) update(delta);
        draw();
        animationId = requestAnimationFrame(gameLoop);
      }

      function movePlayerTo(clientY) {
        const rect = canvas.getBoundingClientRect();
        const canvasY = (clientY - rect.top) * (HEIGHT / rect.height);
        player.y = clamp(canvasY - PADDLE_HEIGHT / 2, 0, HEIGHT - PADDLE_HEIGHT);
      }

      window.addEventListener('keydown', (event) => {
        if (document.body.dataset.activeGame !== 'pong') return;
        const key = event.key.toLowerCase();
        if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', ' '].includes(key)) event.preventDefault();
        if (key === ' ') running ? togglePause() : startGame();
        keys.add(key);
      });

      window.addEventListener('keyup', (event) => keys.delete(event.key.toLowerCase()));
      canvas.addEventListener('pointermove', (event) => movePlayerTo(event.clientY));
      canvas.addEventListener('pointerdown', (event) => {
        movePlayerTo(event.clientY);
        if (!running) startGame();
      });
      startButton.addEventListener('click', () => running ? togglePause() : startGame());
      restartButton.addEventListener('click', restartGame);
      modeButtons.forEach((button) => button.addEventListener('click', () => changeMode(button.dataset.mode)));
      difficultyButtons.forEach((button) => button.addEventListener('click', () => changeDifficulty(button.dataset.difficulty)));
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && running) togglePause();
      });
      window.addEventListener('gamechange', (event) => {
        keys.clear();
        if (event.detail !== 'pong' && running) togglePause();
      });

      updateSettingsUI();
      restartGame();
      cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(gameLoop);
    })();
  </script>
  <script>
    (() => {
      'use strict';

      const navButtons = [...document.querySelectorAll('[data-game-link]')];
      const panels = [...document.querySelectorAll('[data-game-panel]')];

      function showGame(gameName) {
        document.body.dataset.activeGame = gameName;
        panels.forEach((panel) => { panel.hidden = panel.dataset.gamePanel !== gameName; });
        navButtons.forEach((button) => {
          const active = button.dataset.gameLink === gameName;
          button.classList.toggle('active', active);
          if (active) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        window.dispatchEvent(new CustomEvent('gamechange', { detail: gameName }));
      }

      navButtons.forEach((button) => button.addEventListener('click', () => showGame(button.dataset.gameLink)));
    })();
  </script>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('brickGame');
      const ctx = canvas.getContext('2d');
      const scoreElement = document.getElementById('brickScore');
      const livesElement = document.getElementById('brickLives');
      const overlay = document.getElementById('brickOverlay');
      const overlayTitle = document.getElementById('brickOverlayTitle');
      const overlayText = document.getElementById('brickOverlayText');
      const startButton = document.getElementById('brickStartButton');
      const restartButton = document.getElementById('brickRestartButton');

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const PADDLE_WIDTH = 150;
      const PADDLE_HEIGHT = 18;
      const BALL_RADIUS = 10;
      const BRICK_ROWS = 6;
      const BRICK_COLUMNS = 10;
      const BRICK_WIDTH = 82;
      const BRICK_HEIGHT = 26;
      const BRICK_GAP = 10;
      const BRICK_LEFT = 45;
      const BRICK_TOP = 58;
      const COLORS = ['#42e8e0', '#68d8ff', '#8fa7ff', '#9c6bff', '#db70ff', '#ff557a'];

      const paddle = { x: WIDTH / 2 - PADDLE_WIDTH / 2, y: HEIGHT - 48 };
      const ball = { x: WIDTH / 2, y: HEIGHT - 72, vx: 0, vy: 0 };
      const keys = new Set();
      let bricks = [];
      let score = 0;
      let lives = 3;
      let running = false;
      let gameOver = false;
      let lastTime = performance.now();

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function makeBricks() {
        bricks = [];
        for (let row = 0; row < BRICK_ROWS; row += 1) {
          for (let column = 0; column < BRICK_COLUMNS; column += 1) {
            bricks.push({
              x: BRICK_LEFT + column * (BRICK_WIDTH + BRICK_GAP),
              y: BRICK_TOP + row * (BRICK_HEIGHT + BRICK_GAP),
              width: BRICK_WIDTH,
              height: BRICK_HEIGHT,
              color: COLORS[row],
              alive: true
            });
          }
        }
      }

      function updateStats() {
        scoreElement.textContent = score;
        livesElement.textContent = lives;
      }

      function setOverlay(title, text, visible = true) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlay.classList.toggle('hidden', !visible);
      }

      function resetBall() {
        paddle.x = WIDTH / 2 - PADDLE_WIDTH / 2;
        ball.x = WIDTH / 2;
        ball.y = paddle.y - BALL_RADIUS - 4;
        ball.vx = 0;
        ball.vy = 0;
      }

      function launch() {
        if (gameOver) restartGame();
        if (ball.vx === 0 && ball.vy === 0) {
          ball.vx = (Math.random() < 0.5 ? -1 : 1) * 330;
          ball.vy = -430;
        }
        running = true;
        startButton.textContent = 'Pause';
        setOverlay('', '', false);
        lastTime = performance.now();
      }

      function togglePause() {
        running = !running;
        startButton.textContent = running ? 'Pause' : 'Resume';
        setOverlay('Paused', 'Press Space or Resume to continue.', !running);
        lastTime = performance.now();
      }

      function restartGame() {
        score = 0;
        lives = 3;
        gameOver = false;
        running = false;
        makeBricks();
        resetBall();
        updateStats();
        startButton.textContent = 'Start';
        setOverlay('Break the wall', 'Press Space or Start to launch.');
        draw();
      }

      function loseLife() {
        lives -= 1;
        updateStats();
        running = false;
        resetBall();

        if (lives <= 0) {
          gameOver = true;
          startButton.textContent = 'Play Again';
          setOverlay('Game over', `Final score: ${score}. Press Play Again to retry.`);
        } else {
          startButton.textContent = 'Launch';
          setOverlay('Ball lost', `${lives} ${lives === 1 ? 'life' : 'lives'} remaining. Press Space to launch.`);
        }
      }

      function collideWithBricks() {
        for (const brick of bricks) {
          if (!brick.alive) continue;
          const hit = ball.x + BALL_RADIUS > brick.x
            && ball.x - BALL_RADIUS < brick.x + brick.width
            && ball.y + BALL_RADIUS > brick.y
            && ball.y - BALL_RADIUS < brick.y + brick.height;

          if (!hit) continue;
          brick.alive = false;
          score += 10;
          ball.vy *= -1;
          updateStats();

          if (bricks.every((item) => !item.alive)) {
            running = false;
            gameOver = true;
            startButton.textContent = 'Play Again';
            setOverlay('Wall cleared!', `Perfect run. Final score: ${score}.`);
          }
          break;
        }
      }

      function update(delta) {
        const paddleSpeed = 760;
        if (keys.has('a') || keys.has('arrowleft')) paddle.x -= paddleSpeed * delta;
        if (keys.has('d') || keys.has('arrowright')) paddle.x += paddleSpeed * delta;
        paddle.x = clamp(paddle.x, 0, WIDTH - PADDLE_WIDTH);

        ball.x += ball.vx * delta;
        ball.y += ball.vy * delta;

        if (ball.x - BALL_RADIUS <= 0) {
          ball.x = BALL_RADIUS;
          ball.vx = Math.abs(ball.vx);
        } else if (ball.x + BALL_RADIUS >= WIDTH) {
          ball.x = WIDTH - BALL_RADIUS;
          ball.vx = -Math.abs(ball.vx);
        }

        if (ball.y - BALL_RADIUS <= 0) {
          ball.y = BALL_RADIUS;
          ball.vy = Math.abs(ball.vy);
        }

        const paddleHit = ball.vy > 0
          && ball.y + BALL_RADIUS >= paddle.y
          && ball.y - BALL_RADIUS <= paddle.y + PADDLE_HEIGHT
          && ball.x >= paddle.x
          && ball.x <= paddle.x + PADDLE_WIDTH;

        if (paddleHit) {
          const hitPosition = (ball.x - (paddle.x + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
          const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 12, 760);
          ball.vx = hitPosition * speed * 0.86;
          ball.vy = -Math.sqrt(Math.max(speed * speed - ball.vx * ball.vx, 1));
          ball.y = paddle.y - BALL_RADIUS;
        }

        collideWithBricks();
        if (ball.y - BALL_RADIUS > HEIGHT) loseLife();
      }

      function draw() {
        const background = ctx.createLinearGradient(0, 0, WIDTH, HEIGHT);
        background.addColorStop(0, '#080d18');
        background.addColorStop(1, '#0d1021');
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        for (const brick of bricks) {
          if (!brick.alive) continue;
          ctx.save();
          ctx.shadowColor = brick.color;
          ctx.shadowBlur = 12;
          ctx.fillStyle = brick.color;
          ctx.beginPath();
          ctx.roundRect(brick.x, brick.y, brick.width, brick.height, 7);
          ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.shadowColor = '#42e8e0';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#42e8e0';
        ctx.beginPath();
        ctx.roundRect(paddle.x, paddle.y, PADDLE_WIDTH, PADDLE_HEIGHT, 9);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function loop(now) {
        const delta = Math.min((now - lastTime) / 1000, 0.025);
        lastTime = now;
        if (running && document.body.dataset.activeGame === 'breaker') update(delta);
        draw();
        requestAnimationFrame(loop);
      }

      function movePaddleTo(clientX) {
        const rect = canvas.getBoundingClientRect();
        const canvasX = (clientX - rect.left) * (WIDTH / rect.width);
        paddle.x = clamp(canvasX - PADDLE_WIDTH / 2, 0, WIDTH - PADDLE_WIDTH);
      }

      window.addEventListener('keydown', (event) => {
        if (document.body.dataset.activeGame !== 'breaker') return;
        const key = event.key.toLowerCase();
        if (['a', 'd', 'arrowleft', 'arrowright', ' '].includes(key)) event.preventDefault();
        if (key === ' ') running ? togglePause() : launch();
        keys.add(key);
      });
      window.addEventListener('keyup', (event) => keys.delete(event.key.toLowerCase()));
      canvas.addEventListener('pointermove', (event) => movePaddleTo(event.clientX));
      canvas.addEventListener('pointerdown', (event) => {
        movePaddleTo(event.clientX);
        if (!running) launch();
      });
      startButton.addEventListener('click', () => running ? togglePause() : launch());
      restartButton.addEventListener('click', restartGame);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && running) togglePause();
      });
      window.addEventListener('gamechange', (event) => {
        keys.clear();
        if (event.detail !== 'breaker' && running) togglePause();
      });

      restartGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
